<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Warning</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">

    <style>
        /* Basic Setup */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* light gray */
            color: #1f2937; /* dark gray */
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        /* Main container */
        .container {
            max-width: 36rem; /* 576px */
            margin: auto;
            padding: 2rem;
            border-radius: 1rem; /* 16px */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            background-color: white;
            border: 1px solid #ef4444; /* red-500 */
            text-align: center;
        }

        /* Icon */
        .icon-container {
            margin-bottom: 1.5rem; /* 24px */
        }
        .icon-svg {
            width: 4rem; /* 64px */
            height: 4rem; /* 64px */
            margin: auto;
            color: #f59e0b; /* yellow-500 */
        }

        /* Typography */
        h1 {
            font-size: 1.875rem; /* 30px */
            font-weight: 700;
            margin-bottom: 1rem; /* 16px */
            color: #dc2626; /* red-600 */
        }
        p.subtitle {
            color: #4b5563; /* gray-600 */
            font-size: 1.125rem; /* 18px */
            margin-bottom: 1.5rem; /* 24px */
        }

        /* URL and Confidence Box */
        .details-box {
            background-color: #f3f4f6; /* gray-100 */
            padding: 1rem; /* 16px */
            border-radius: 0.75rem; /* 12px */
            margin-bottom: 1.5rem; /* 24px */
            border: 1px solid #d1d5db; /* gray-300 */
            text-align: left;
        }
        #dangerous-url {
            font-size: 0.875rem; /* 14px */
            font-weight: 600;
            color: #374151; /* gray-700 */
            word-break: break-all;
        }
        .confidence-text {
            font-size: 0.875rem; /* 14px */
            margin-top: 0.5rem; /* 8px */
            color: #4b5563; /* gray-600 */
        }
        #confidence-score {
            font-weight: 700;
            color: #ef4444; /* red-500 */
        }

        /* Reasons Box */
        .reasons-box {
            background-color: #f3f4f6; /* gray-100 */
            padding: 1.5rem; /* 24px */
            border-radius: 0.75rem; /* 12px */
            margin-bottom: 2rem; /* 32px */
            border: 1px solid #d1d5db; /* gray-300 */
            text-align: left;
        }
        .reasons-box h2 {
            font-size: 1.25rem; /* 20px */
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.75rem; /* 12px */
            color: #ef4444; /* red-500 */
        }
        #reasons-list {
            list-style-type: disc;
            list-style-position: inside;
            padding-left: 0;
            margin: 0;
            color: #4b5563; /* gray-600 */
        }
        #reasons-list li {
            margin-bottom: 0.5rem; /* 8px */
        }

        /* Buttons */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem; /* 12px */
        }
        @media (min-width: 640px) {
            .button-container {
                flex-direction: row;
                gap: 1rem; /* 16px */
            }
        }
        .button {
            flex: 1;
            width: 100%;
            font-weight: 600;
            padding: 0.75rem 1.5rem; /* 12px 24px */
            border-radius: 9999px;
            transition: background-color 0.3s, transform 0.1s;
            cursor: pointer;
            border: none;
            font-size: 1rem; /* 16px */
        }
        .button:active {
            transform: scale(0.98);
        }
        #back-button {
            background-color: #2563eb; /* blue-600 */
            color: white;
        }
        #back-button:hover {
            background-color: #1d4ed8; /* blue-700 */
        }
        #proceed-button {
            background-color: #d1d5db; /* gray-300 */
            color: #1f2937; /* gray-800 */
        }
        #proceed-button:hover {
            background-color: #9ca3af; /* gray-400 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <svg class="icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        <h1>Deceptive Site Ahead</h1>
        <p class="subtitle">Our AI has identified this site as a potential security risk. Proceeding may expose your personal information.</p>
        
        <div class="details-box">
            <p id="dangerous-url">Loading URL...</p>
            <p class="confidence-text">
                Confidence: <span id="confidence-score">...%</span>
            </p>
        </div>

        <div class="reasons-box">
            <h2>Why was this flagged?</h2>
            <ul id="reasons-list">
                <li>Checking reasons...</li>
            </ul>
        </div>

        <div class="button-container">
            <button id="back-button" class="button">Go Back to Safety</button>
            <button id="proceed-button" class="button">Proceed Anyway</button>
        </div>
    </div>

    <script src="warning.js"></script>
</body>
</html>
